<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found | RIQS – Ritvish Inspection &amp; Quality Services</title>
    <!-- An error page has no business in search results. -->
    <meta name="robots" content="noindex" />
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body>
    <!-- The background lives on this wrapper, not the body: index.css sets a
         plain white body background, which outranks a Tailwind utility on the
         body element itself. -->
    <div class="flex min-h-svh flex-col bg-navy-950 text-steel-100">
    <header class="px-4 py-5 sm:px-8">
      <a href="%BASE_URL%" class="inline-flex items-center rounded-md bg-white/95 px-2.5 py-1.5">
        <img src="/src/assets/ritvish-logo.webp" alt="Ritvish" class="h-9 w-auto" />
      </a>
    </header>

    <main class="flex flex-1 items-center justify-center px-4 py-12 text-center">
      <div class="max-w-xl">
        <p class="font-heading text-8xl font-bold text-amber-400 sm:text-9xl">404</p>
        <h1 class="mt-2 font-heading text-3xl font-bold text-white sm:text-4xl">
          We can't find that page
        </h1>
        <p class="mt-4 text-base text-steel-100/80">
          The address you followed doesn't lead anywhere on this site. It may have been mistyped
          or moved.
        </p>
        <div class="mt-8 flex flex-col items-center justify-center gap-3 sm:flex-row">
          <a
            href="%BASE_URL%"
            class="w-full rounded-md bg-steel-500 px-7 py-3 text-sm font-semibold text-white transition-colors hover:bg-steel-400 sm:w-auto"
          >
            Back to the home page
          </a>
          <a
            href="%BASE_URL%#contact"
            class="w-full rounded-md border-2 border-steel-300/60 px-7 py-3 text-sm font-semibold text-white transition-colors hover:border-steel-300 hover:bg-white/5 sm:w-auto"
          >
            Contact us
          </a>
        </div>
      </div>
    </main>
    </div>
  </body>
</html>
